# VALGFRI tilføjelse — ikke inkluderet af printer.cfg.
#
# Genopstået/rettet udgave af den gamle, døde `configs/Nevermore`-fil
# (baseret på https://github.com/MapleLeafMakers/KlipperMacros air_filter_timer).
# Den oprindelige udgave pegede på et `[fan_generic NeverMore]`-objekt der ikke
# længere findes. Denne udgave tæller i stedet timer på jeres rigtige
# Nevermore-fan (`fan_generic nevermore_fan`, oprettet automatisk af
# `[nevermore]`-modulet i configs/NevermoreMini.cfg).
#
# For at tage den i brug:
#   1. Flyt/kopiér denne fil til printer_data/config/configs/
#   2. Sørg for at [save_variables] findes i printer.cfg (I har allerede
#      saved_variables.cfg inkluderet, så det er formentlig fint)
#   3. RESET_AIR_FILTER nulstiller tælleren, QUERY_AIR_FILTER viser antal timer

[delayed_gcode _AIR_FILTER_VARIABLES_INIT]
initial_duration: 0
gcode:

[gcode_macro _AIR_FILTER_VARIABLES]
variable_fan: 'fan_generic nevermore_fan'          # Det rigtige Nevermore-fan-objekt
variable_hours_until_replacement: 500              # Juster efter jeres filtertype
variable_replacement_gcode: 'M117 Skift Nevermore-filter'
variable_time: -1
gcode:

[gcode_macro RESET_AIR_FILTER]
description: Nulstiller Nevermore-filterets levetidstæller
gcode:
  SET_GCODE_VARIABLE MACRO=_AIR_FILTER_VARIABLES VARIABLE=time VALUE=0
  SAVE_VARIABLE VARIABLE=nevermore_filter_time VALUE=0
  { action_respond_info("Nevermore filter-tæller nulstillet.") }

[gcode_macro QUERY_AIR_FILTER]
description: Viser hvor mange timer Nevermore-filteret har kørt siden sidste nulstilling
gcode:
  {% set hours = "%.2f"|format(printer['gcode_macro _AIR_FILTER_VARIABLES'].time|int / 3600) %}
  { action_respond_info("Nevermore filter-timer: " + hours) }

[delayed_gcode _AIR_FILTER_TIMER]
initial_duration: 1
gcode:
  {% set cached_time = printer['gcode_macro _AIR_FILTER_VARIABLES'].time|int %}
  {% if cached_time == -1 %}
    {% set cached_time = printer.save_variables.variables.nevermore_filter_time|default(0) %}
    SET_GCODE_VARIABLE MACRO=_AIR_FILTER_VARIABLES VARIABLE=time VALUE={ cached_time }
  {% endif %}
  {% if printer[printer['gcode_macro _AIR_FILTER_VARIABLES'].fan].speed|float > 0 %}
    SET_GCODE_VARIABLE MACRO=_AIR_FILTER_VARIABLES VARIABLE=time VALUE={ cached_time + 1 }
  {% endif %}
  {% set replacement_seconds = printer['gcode_macro _AIR_FILTER_VARIABLES'].hours_until_replacement|float * 3600 %}
  {% if cached_time > replacement_seconds %}
    { printer['gcode_macro _AIR_FILTER_VARIABLES'].replacement_gcode }
  {% endif %}
  UPDATE_DELAYED_GCODE ID=_AIR_FILTER_TIMER DURATION=1

[delayed_gcode _AIR_FILTER_FLUSH_TIMER]
initial_duration: 300
gcode:
  {% set saved_time = printer.save_variables.variables.nevermore_filter_time|default(0)|float %}
  {% set actual_time = printer['gcode_macro _AIR_FILTER_VARIABLES'].time|float %}
  {% if saved_time != actual_time %}
    SAVE_VARIABLE VARIABLE=nevermore_filter_time VALUE={actual_time}
  {% endif %}
  UPDATE_DELAYED_GCODE ID=_AIR_FILTER_FLUSH_TIMER DURATION=300
