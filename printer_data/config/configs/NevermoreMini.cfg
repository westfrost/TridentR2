[nevermore]
# If you're using USB instead of BT, uncomment and specify the correct serial device.
# WARNING: Make sure it's the `-if02` interface, not `-if00`.
serial: /dev/serial/by-id/usb-Nevermore_Filter_fysetc-rp2040-touch-v1_E6612C771F0C802B-if02

# These `fan_power_*` entries are for a DELTA BFB0712HF (StealthMax BOM)
# If you have a different fan then play with these numbers to the satisfaction.
# See full config documentation for details.
# (e.g. See `fan_power_automatic` if you'd prefer very quiet background filtering.)
fan_power_coefficient: 1  # lower max power to keep things much more quiet

# If the fan isn't a DELTA BFB0712HF (StealthMax BOM), you'll probably want to add
#   fan_power_minimum: ???
#   fan_power_kick_start_minimum: ???
# See full-doc for details and some common values.

# The Klipper module auto-enters "print mode" (fan forced to 100%, VOC calibration
# paused) whenever any extruder has a non-zero target temp. Gate that on the bed
# also being heated so a bare hotend heat (nozzle swap, PID tune, probe calibration)
# doesn't blast the fan to 100% and pause calibration for something that isn't a print.
print_mode_min_bed_target: 40

# Fan is forced to 100% during print mode regardless of this (see
# print_mode_min_bed_target above) - this threshold only matters once a print
# ends and print mode is released. Without it, the fan has no "automatic" state
# to fall back into, so it would cut straight to near-zero the instant a print
# finishes, even if the enclosure still reeks from the print. With it, the fan
# keeps running post-print until exhaust VOC drops back under this value, then
# stops (after fan_policy_cooldown).
# Set above this unit's measured idle/resting baseline (~168, from new-build
# off-gassing sitting in a sealed enclosure with no airflow) so idle ambient
# drift alone doesn't wake the fan - it should only react to a genuine
# post-print VOC spike, not to sitting closed and unused.
fan_policy_voc_passive_max: 200
# How long to keep filtering after VOC drops back under the threshold (seconds).
# Module default is 900 (15 min); stated explicitly here so it's easy to tune.
fan_policy_cooldown: 900

# Optional
# This 'temperature' sensor only serves to draw the intake VOC index on
# Mainsail/Fluidd's temperature plot.
[temperature_sensor nevermore_exhaust_VOC]
sensor_type: NevermoreSensor
sensor_kind: exhaust
plot_voc: true