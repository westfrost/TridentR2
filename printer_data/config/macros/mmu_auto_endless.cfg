[gcode_macro MMU_AUTO_ENDLESS_GROUPS]
description: Group gates with same material + color into the same EndlessSpool group
gcode:
  {% if printer.mmu is defined and printer.mmu.enabled %}
    {% set materials = printer.mmu.gate_material %}
    {% set colors = printer.mmu.gate_color %}
    {% set keys = [] %}
    {% set groups = [] %}
    {% for gate in range(materials|length) %}
      {% set key = (materials[gate]|string|upper|trim) ~ "|" ~ (colors[gate]|string|lower|trim) %}
      {% if key not in keys %}
        {% set _ = keys.append(key) %}
      {% endif %}
      {% set _ = groups.append(keys.index(key)) %}
    {% endfor %}
    MMU_ENDLESS_SPOOL GROUPS={groups|join(",")}
  {% endif %}
