[gcode_macro BRUSH]
# Børsten sidder fast på rammen. Ingen Z-bevægelse i denne makro.
variable_temp: 190          # wipe-temp for ABS/ASA
variable_x_start: 50        # venstre kant af børsten
variable_x_end: 80          # højre kant af børsten
variable_y_brush: 350       # børstens Y-position
variable_y_park: 175        # tilgangs-/returpunkt
variable_passes: 6          # antal frem-tilbage-strøg
variable_speed: 9000        # 150 mm/s under selve wipen
variable_dry_run: 0         # 1 = spring temperaturvent over
gcode:
    G90                                          # absolut positionering
    G1 X{x_start} Y{y_park} F12000               # kør til tilgangspunkt

    {% if dry_run == 0 %}                        # springes over ved dry-run
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={temp - 5} MAXIMUM={temp + 15}
    {% else %}
        M118 DRY RUN: springer temperaturvent over
    {% endif %}

    G1 Y{y_brush} F12000                         # ind til børsten
    {% for i in range(passes) %}                 # gentag wipe-strøg
        G1 X{x_end} F{speed}                     # -> højre gennem børsten
        G1 X{x_start} F{speed}                   # <- venstre gennem børsten
    {% endfor %}
    G1 Y{y_park} F12000                          # tilbage til tilgangspunkt