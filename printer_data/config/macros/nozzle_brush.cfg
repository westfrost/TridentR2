[gcode_macro WIPE_NOZZLE]
# Børsten sidder fast på rammen i fast højde. Kun XY.
variable_x_start: 50        # venstre kant af børsten
variable_x_end: 80          # højre kant af børsten
variable_y_brush: 350       # børstens Y-position
variable_y_park: 175        # tilgangs-/parkerings-Y
variable_passes: 12          # giver 2*passes-1 strøg
variable_speed: 9000        # 150 mm/s under wipen
gcode:
    G90                                     # absolut positionering
    G1 X{x_start} Y{y_park} F12000          # tilgang ved x50
    G1 Y{y_brush} F12000                    # ind i børsten
    {% for i in range(passes) %}
        G1 X{x_end} F{speed}                # -> højre
        {% if not loop.last %}
            G1 X{x_start} F{speed}          # <- venstre
        {% endif %}
    {% endfor %}
    G1 Y{y_park} F12000                     # lige ud, parkerer på x80