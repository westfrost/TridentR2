gcode:
  # ---------- Read parameters passed in from the slicer ----------
  {% set target_bed = params.BED|int %}
  {% set target_extruder = params.EXTRUDER|int %}
  {% set target_chamber = params.CHAMBER|default("45")|int %}
  {% set target_chamber_minimal = params.CHAMBER_MINIMAL|default("0")|int %}
  {% set target_chamber_wait = [target_chamber, target_chamber_minimal]|select(">", 0)|min|default(0) %}
  {% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}
  {% set y_wait = printer.toolhead.axis_maximum.y|float / 2 %}
  {% set initial_tool = params.INITIAL_TOOL|default(-1)|int %}
  {% set referenced_tools = params.REFERENCED_TOOLS|default('')|string %}
  {% set mmu_enabled = printer.mmu is defined and printer.mmu.enabled %}

  # ---------- Print start summary ----------
  RESPOND MSG="🖨️ Print started! Hotend: {target_extruder}c, Bed: {target_bed}c, Chamber: {target_chamber_wait}c"
  
  # Turn on LED strip
  SET_PIN PIN=LED VALUE=1  ; on
  
  # ---------- Clear any previous pause state and home all axes ----------
  CLEAR_PAUSE
  G28
  G90
  
  # MMU: setup + check that all used gates have filament (fails fast, before heatsoak)
  {% if mmu_enabled %}
    MMU_START_SETUP {% if initial_tool >= 0 %}INITIAL_TOOL={initial_tool}{% endif %} {% if referenced_tools %}REFERENCED_TOOLS={referenced_tools}{% endif %}
    {% if printer.mmu.filament_pos == 10 %}
      # Filament already loaded: MMU_START_CHECK would unload it just to run the physical
      # gate check. Pre-gate sensors already report gate status, so verify without moving.
      {% if referenced_tools %}
        {% for t in referenced_tools.split(',') %}
          {% set gate = printer.mmu.ttg_map[t|int] %}
          {% if printer.mmu.gate_status[gate] == 0 %}
            MMU_PAUSE MSG="Gate {gate} (T{t}) is empty - insert filament and resume"
          {% endif %}
        {% endfor %}
      {% endif %}
    {% else %}
      MMU_START_CHECK
    {% endif %}
  {% endif %}
  
  # ---------- Clear old bed mesh so a fresh one can be generated later ----------
  BED_MESH_CLEAR

  # ---------- Heat the bed (and soak chamber for higher-temp prints) ----------
  {% if target_bed > 90 %}
    SET_DISPLAY_TEXT MSG="Bed: {target_bed}c"
    RESPOND MSG="🔥 Bed: {target_bed}c"
    # Part cooling fan helps circulate chamber air during the soak (100%)
    M106 S255
    SET_FAN_SPEED FAN=NeverMore SPEED=1              	# Start NeverMore
    SET_FAN_SPEED FAN=BedFan SPEED=1					# Start BedFan
    G1 X{x_wait} Y{y_wait} Z15 F9000
    M190 S{target_bed}
    SET_DISPLAY_TEXT MSG="Heatsoak: {target_chamber_wait}c"
    RESPOND MSG="♨️ Heatsoak: {target_chamber_wait}c"
    TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM={target_chamber_wait}

  {% else %}
    SET_DISPLAY_TEXT MSG="Bed: {target_bed}c"
    RESPOND MSG="🔥 Bed: {target_bed}c"
    G1 X{x_wait} Y{y_wait} Z15 F9000
    M190 S{target_bed}
    SET_DISPLAY_TEXT MSG="Soak for 10 min"
    RESPOND MSG="⏳ Soak for 10 min"
    G4 P600000
  {% endif %}

  # ---------- Pre-heat hotend to a probe-safe temperature ----------
  SET_DISPLAY_TEXT MSG="Hotend: 150c"
  RESPOND MSG="🌡️ Hotend: 150c"
  M109 S150
  TEMPERATURE_WAIT SENSOR=extruder MINIMUM=148

  # ---------- Level the bed relative to the gantry, then re-home Z ----------
  SET_DISPLAY_TEXT MSG="Leveling"
  RESPOND MSG="📐 Leveling"
  Z_TILT_ADJUST
  G28 Z

  # ---------- Generate a fresh bed mesh at print temperatures ----------
  SET_DISPLAY_TEXT MSG="Bed mesh"
  RESPOND MSG="🔍 Bed mesh"
  BED_MESH_CALIBRATE ADAPTIVE=1

  # ---------- Heat hotend to print temperature ----------
  SET_DISPLAY_TEXT MSG="Hotend: {target_extruder}c"
  RESPOND MSG="🎯 Hotend: {target_extruder}c"
  G1 X{x_wait} Y{y_wait} Z15 F9000
  M107
  M104 S{target_extruder}
  TEMPERATURE_WAIT SENSOR=extruder MINIMUM={target_extruder - 2}

  # MMU: load initial tool now that hotend is at print temp (must happen before prime line)
  {% if mmu_enabled %}
    MMU_START_LOAD_INITIAL_TOOL
  {% endif %}
  
  # ---------- Purge / prime line, then hand off to the print ----------
  SET_DISPLAY_TEXT MSG="Printer goes brr"
  RESPOND MSG="🚀 Printer goes brr"
  SQUIGGLY_PURGE ADAPTIVE_MODE=1 LINE_MARGIN=15