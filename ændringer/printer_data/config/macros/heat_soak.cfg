#####################################################################
#   Adaptiv heat soak - koerer indtil den termiske drift er ophoert
#####################################################################
#
# PRINCIP
#   Naar bed'et har naaet sin temperatur og dysen staar paa probe-
#   temperatur (150c), probes bed-centrum en gang som baseline.
#   Derefter probes det samme punkt hvert 'interval' (5 min), og
#   forskellen til forrige maaling er den termiske drift i ramme,
#   gantry og bed. Naar driften har vaeret under 'z_drift' i
#   'stable_required' cyklusser i traek - og kammeret baade er varmt
#   nok og selv er holdt op med at stige - er maskinen gennemvarm,
#   og printet fortsaetter.
#
#   Der homes ALDRIG Z undervejs. Alle maalinger deler derfor samme
#   nulpunkt, og deltaet er ren drift og ikke homing-stoej.
#
# HVORFOR KODEN SER SAADAN UD
#   1) Klipper har ingen while-loekke. PRINT_START kalder derfor
#      _HEATSOAK_STEP i en for-loekke op til 'max_cycles' gange.
#      Hvert kald er en frisk render, saa det kan laese 'done'-flaget
#      og springe over med det samme, naar soaken er faerdig. De
#      overskydende kald koster ingenting.
#   2) En makros template renderes FOER dens kommandoer udfoeres.
#      printer.probe.last_z_result kan derfor ikke laeses i den samme
#      makro, som kalder PROBE - resultatet ville vaere fra forrige
#      maaling. Derfor ligger maalingen i _HEATSOAK_PROBE og
#      vurderingen i _HEATSOAK_EVAL, som foerst renderes naar proben
#      rent faktisk er koert.
#   3) Ventetiden deles i 1-minuts G4-bidder. Det giver nedtaelling
#      paa displayet og holder lookahead-koeen kort.
#
# SLICER-OVERRIDES (sendes til PRINT_START)
#   SOAK=0                 slaar drift-soaken fra, bruger fast tid
#   SOAK_INTERVAL=300      sekunder mellem maalinger
#   SOAK_DRIFT=0.0075      mm drift der regnes som "stoppet"
#   SOAK_CHAMBER_DRIFT=0.3 grader kammerdrift pr. interval
#   SOAK_MIN=2             minimum antal cyklusser
#   SOAK_STABLE=2          antal stabile cyklusser i traek
#   SOAK_MAX=12            hardt loft paa antal cyklusser (60 min)


############### Indstillinger - ret her ###############

[gcode_macro _HEATSOAK_VARS]
variable_interval: 300          # Sekunder mellem hver probe-maaling
variable_z_drift: 0.0075        # mm. Samme tolerance som z_tilt retry_tolerance
variable_chamber_drift: 0.3     # grader C som kammeret maa aendre sig pr. interval
variable_min_cycles: 2          # Mindste antal cyklusser, uanset hvor stabil maskinen er
variable_max_cycles: 12         # Hardt loft. 12 x 5 min = 60 min, derefter printes der alligevel
variable_stable_required: 2     # Antal stabile maalinger i traek foer soaken er faerdig
variable_probe_temp: 150        # Dysetemperatur under hele soaken (probe.cfg tillader max 150)
variable_probe_z: 5             # Hoejde proben starter nedturen fra
variable_park_z: 15             # Hoejde toolhead'en venter i mellem maalingerne
variable_samples_tolerance: 0.02        # Loesere end probe.cfg med vilje - se kommentar i _HEATSOAK_PROBE
variable_samples_tolerance_retries: 5
gcode:


############### Runtime-tilstand - ret ikke ###############

[gcode_macro _HEATSOAK_STATE]
variable_done: 0                # 1 = soaken er faerdig, resten af for-loekken no-opper
variable_cycle: 0               # Antal gennemfoerte maalecyklusser (baseline taeller ikke med)
variable_stable: 0              # Antal stabile cyklusser i traek lige nu
variable_last_z: 0.0            # Forrige probe-resultat
variable_last_chamber: 0.0      # Forrige kammertemperatur
variable_chamber_target: 0      # Kammertemperatur der skal vaere naaet foer soaken maa slutte
variable_elapsed: 0             # Sekunder brugt paa soak
# Aktive graenser for denne koersel. Kopieres fra _HEATSOAK_VARS ved
# start, saa slicer-overrides ikke aendrer dine defaults permanent.
variable_interval: 300
variable_z_drift: 0.0075
variable_chamber_drift: 0.3
variable_min_cycles: 2
variable_stable_required: 2
gcode:


############### Start: nulstil og tag baseline ###############

[gcode_macro _HEATSOAK_BEGIN]
description: Nulstiller heat soak-tilstanden og tager baseline-maalingen
gcode:
    {% set v = printer['gcode_macro _HEATSOAK_VARS'] %}

    SET_GCODE_VARIABLE MACRO=_HEATSOAK_STATE VARIABLE=done VALUE=0
    SET_GCODE_VARIABLE MACRO=_HEATSOAK_STATE VARIABLE=cycle VALUE=0
    SET_GCODE_VARIABLE MACRO=_HEATSOAK_STATE VARIABLE=stable VALUE=0
    SET_GCODE_VARIABLE MACRO=_HEATSOAK_STATE VARIABLE=elapsed VALUE=0
    SET_GCODE_VARIABLE MACRO=_HEATSOAK_STATE VARIABLE=chamber_target VALUE={params.CHAMBER|default(0)|int}
    SET_GCODE_VARIABLE MACRO=_HEATSOAK_STATE VARIABLE=interval VALUE={params.INTERVAL|default(v.interval)|int}
    SET_GCODE_VARIABLE MACRO=_HEATSOAK_STATE VARIABLE=z_drift VALUE={params.Z_DRIFT|default(v.z_drift)|float}
    SET_GCODE_VARIABLE MACRO=_HEATSOAK_STATE VARIABLE=chamber_drift VALUE={params.CHAMBER_DRIFT|default(v.chamber_drift)|float}
    SET_GCODE_VARIABLE MACRO=_HEATSOAK_STATE VARIABLE=min_cycles VALUE={params.MIN_CYCLES|default(v.min_cycles)|int}
    SET_GCODE_VARIABLE MACRO=_HEATSOAK_STATE VARIABLE=stable_required VALUE={params.STABLE|default(v.stable_required)|int}

    # Bedfans laases i fast hastighed, saa et ramp-skift midt i
    # maaleserien ikke forstyrrer driftmaalingen
    BEDFAN_SOAK_MODE

    SET_DISPLAY_TEXT MSG="Heat soak: baseline"
    _HEATSOAK_PROBE
    _HEATSOAK_EVAL BASELINE=1


############### En maalecyklus ###############

[gcode_macro _HEATSOAK_STEP]
description: Venter et interval og maaler driften. No-op naar soaken er faerdig
gcode:
    {% set st = printer['gcode_macro _HEATSOAK_STATE'] %}
    {% if st.done|int == 0 %}
        {% set interval = st.interval|int %}
        {% set cycle = st.cycle|int + 1 %}
        {% set mins = (interval // 60)|int %}
        {% set rest = interval % 60 %}

        {% for m in range(mins, 0, -1) %}
            SET_DISPLAY_TEXT MSG="Soak {cycle}: {m} min"
            G4 P60000
        {% endfor %}
        {% if rest > 0 %}
            G4 P{rest * 1000}
        {% endif %}

        SET_DISPLAY_TEXT MSG="Soak {cycle}: maaler"
        _HEATSOAK_PROBE
        _HEATSOAK_EVAL
    {% endif %}


############### Selve maalingen ###############

[gcode_macro _HEATSOAK_PROBE]
description: Prober bed-centrum en gang. Homer bevidst IKKE Z
gcode:
    {% set v = printer['gcode_macro _HEATSOAK_VARS'] %}
    {% set cx = printer.toolhead.axis_maximum.x|float / 2 %}
    {% set cy = printer.toolhead.axis_maximum.y|float / 2 %}

    G90
    G1 Z{v.park_z} F1500
    G1 X{cx} Y{cy} F9000
    G1 Z{v.probe_z} F1500
    # Loesere samples_tolerance end i probe.cfg: tidligt i soaken
    # bevaeger bed'et sig maaleligt mellem to samples, og en fejl her
    # ville afbryde printet. Median af 3 er stadig rigelig praecis til
    # at maale drift paa 0.0075 mm-niveau.
    PROBE SAMPLES=3 SAMPLES_RESULT=median SAMPLES_TOLERANCE={v.samples_tolerance} SAMPLES_TOLERANCE_RETRIES={v.samples_tolerance_retries}
    G1 Z{v.park_z} F1500


############### Vurdering af maalingen ###############

[gcode_macro _HEATSOAK_EVAL]
description: Sammenligner sidste probe med den forrige og afgoer om driften er stoppet
gcode:
    {% set st = printer['gcode_macro _HEATSOAK_STATE'] %}
    {% set baseline = params.BASELINE|default(0)|int %}
    {% set z = printer.probe.last_z_result|float %}
    {% set ch = printer['temperature_sensor chamber'].temperature|float %}

    SET_GCODE_VARIABLE MACRO=_HEATSOAK_STATE VARIABLE=last_z VALUE={z}
    SET_GCODE_VARIABLE MACRO=_HEATSOAK_STATE VARIABLE=last_chamber VALUE={ch}

    {% if baseline %}
        { action_respond_info(
            "Heat soak: baseline z=%.4f mm, kammer %.1fc (maal %dc). Maaler hvert %d. minut, "
            "stopper naar driften er under %.4f mm i %d cyklusser i traek."
            % (z, ch, st.chamber_target|int, (st.interval|int / 60)|int,
               st.z_drift|float, st.stable_required|int)) }
    {% else %}
        {% set cycle = st.cycle|int + 1 %}
        {% set elapsed = st.elapsed|int + st.interval|int %}
        {% set dz = z - st.last_z|float %}
        {% set dch = ch - st.last_chamber|float %}
        {% set z_ok = dz|abs <= st.z_drift|float %}
        {% set ch_stable = dch|abs <= st.chamber_drift|float %}
        {% set ch_hot = ch >= st.chamber_target|float %}
        {% set stable = (st.stable|int + 1) if (z_ok and ch_stable and ch_hot) else 0 %}
        {% set finished = stable >= st.stable_required|int and cycle >= st.min_cycles|int %}

        SET_GCODE_VARIABLE MACRO=_HEATSOAK_STATE VARIABLE=cycle VALUE={cycle}
        SET_GCODE_VARIABLE MACRO=_HEATSOAK_STATE VARIABLE=elapsed VALUE={elapsed}
        SET_GCODE_VARIABLE MACRO=_HEATSOAK_STATE VARIABLE=stable VALUE={stable}

        { action_respond_info(
            "Heat soak %d (%d min): z=%.4f dz=%+.4f mm [%s] | kammer %.1fc d=%+.1fc [%s]%s | stabil %d/%d"
            % (cycle, (elapsed / 60)|int, z, dz, "ok" if z_ok else "drift",
               ch, dch, "ok" if ch_stable else "stiger",
               "" if ch_hot else " under maal", stable, st.stable_required|int)) }

        {% if finished %}
            SET_GCODE_VARIABLE MACRO=_HEATSOAK_STATE VARIABLE=done VALUE=1
            { action_respond_info(
                "Heat soak faerdig efter %d min - termisk drift er stoppet." % ((elapsed / 60)|int)) }
        {% endif %}
    {% endif %}


############### Afslutning ###############

[gcode_macro _HEATSOAK_FINISH]
description: Advarer hvis soaken loeb ind i det hardte loft i stedet for at stabilisere sig
gcode:
    {% set st = printer['gcode_macro _HEATSOAK_STATE'] %}
    {% if st.done|int == 0 %}
        { action_respond_info(
            "ADVARSEL: heat soak naaede loftet paa %d min uden at driften stoppede "
            "(sidste z=%.4f mm, kammer %.1fc, maal %dc). Fortsaetter alligevel. "
            "Tjek om kammeret kan komme op paa temperatur, eller haev SOAK_MAX."
            % ((st.elapsed|int / 60)|int, st.last_z|float,
               st.last_chamber|float, st.chamber_target|int)) }
    {% endif %}


############### Manuel brug ###############

[gcode_macro HEAT_SOAK]
description: Koerer den drift-baserede heat soak manuelt. Params: BED, CHAMBER, SOAK_MAX
gcode:
    {% set v = printer['gcode_macro _HEATSOAK_VARS'] %}
    {% set bed = params.BED|default(110)|int %}
    {% set chamber = params.CHAMBER|default(0)|int %}
    {% set soak_max = params.SOAK_MAX|default(v.max_cycles)|int %}
    {% set cx = printer.toolhead.axis_maximum.x|float / 2 %}
    {% set cy = printer.toolhead.axis_maximum.y|float / 2 %}

    {% if not (printer.toolhead.homed_axes == "xyz") %}
        G28
    {% endif %}
    G90
    {% if chamber > 0 %}
        SET_FAN_SPEED FAN=NeverMore SPEED=1.0
    {% endif %}
    G1 X{cx} Y{cy} Z{v.park_z} F9000
    M104 S{v.probe_temp}
    M190 S{bed}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={v.probe_temp - 2}

    _HEATSOAK_BEGIN CHAMBER={chamber}
    {% for i in range(soak_max) %}
        _HEATSOAK_STEP
    {% endfor %}
    _HEATSOAK_FINISH
    SET_DISPLAY_TEXT MSG="Soak faerdig"
