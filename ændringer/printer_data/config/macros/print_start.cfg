#####################################################################
#   A better print_start macro for v2/trident by jontek2
#   Tilpasset: drift-baseret heat soak (se macros/heat_soak.cfg)
#####################################################################

[gcode_macro PRINT_START]
gcode:
  # This part fetches data from your slicer. Such as bed, extruder, and chamber temps and size of your printer.
  {% set target_bed = params.BED|int %}
  {% set target_extruder = params.EXTRUDER|int %}
  {% set target_chamber = params.CHAMBER|default("45")|int %}
  {% set target_chamber_minimal = params.CHAMBER_MINIMAL|default("0")|int %}
  {% set target_chamber_wait = [target_chamber, target_chamber_minimal]|select(">", 0)|min|default(0) %}
  {% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}
  {% set y_wait = printer.toolhead.axis_maximum.y|float / 2 %}
  {% set initial_tool = params.INITIAL_TOOL|default(-1)|int %}
  {% set referenced_tools = params.REFERENCED_TOOLS|default('')|string %}
  {% set mmu_enabled = printer.mmu is defined and printer.mmu.enabled %}

  # Heat soak-opsaetning. SOAK=0 slaar drift-maalingen fra og bruger et
  # fast tidsbaseret soak paa SOAK_MINUTES i stedet (fx til PLA).
  # Resten af graenserne staar i _HEATSOAK_VARS i macros/heat_soak.cfg
  # og kan overrules pr. print fra sliceren.
  {% set hs = printer['gcode_macro _HEATSOAK_VARS'] %}
  {% set soak = params.SOAK|default(1)|int %}
  {% set soak_minutes = params.SOAK_MINUTES|default(5)|int %}
  {% set soak_max = params.SOAK_MAX|default(hs.max_cycles)|int %}


  # Turn on LED strip
  SET_PIN PIN=LED VALUE=1  ; on

  # Clear any lingering pause states
  CLEAR_PAUSE

  # Home the printer, set absolute positioning
  G28                                                   # Full home (XYZ)
  G90                                                   # Absolute position

  # MMU: setup + check that all used gates have filament (fails fast, before heatsoak)
  {% if mmu_enabled %}
    MMU_START_SETUP {% if initial_tool >= 0 %}INITIAL_TOOL={initial_tool}{% endif %} {% if referenced_tools %}REFERENCED_TOOLS={referenced_tools}{% endif %}
    {% if printer.mmu.filament_pos == 10 %}
      # Filament already loaded: MMU_START_CHECK would unload it just to run the physical
      # gate check. Pre-gate sensors already report gate status, so verify without moving.
      {% if referenced_tools %}
        {% for t in referenced_tools.split(',') %}
          {% set gate = printer.mmu.ttg_map[t|int] %}
          {% if printer.mmu.gate_status[gate] == 0 %}
            MMU_PAUSE MSG="Gate {gate} (T{t}) is empty - insert filament and resume"
          {% endif %}
        {% endfor %}
      {% endif %}
    {% else %}
      MMU_START_CHECK
    {% endif %}
  {% endif %}

  ##  Uncomment for bed mesh (1 of 2 for bed mesh)
  BED_MESH_CLEAR                                        # Clear old saved bed mesh (if any)

  #####################################################################
  #   Opvarmning
  #####################################################################
  SET_DISPLAY_TEXT MSG="Bed: {target_bed}c"             # Display info on display
  {% if target_chamber > 0 %}
    SET_FAN_SPEED FAN=NeverMore SPEED=1.0               # Start NeverMore
  {% endif %}
  G1 X{x_wait} Y{y_wait} Z15 F9000                      # Go to center of the bed

  # Dysen varmer op sideloebende med bed'et. Den skal alligevel staa paa
  # probe-temperatur under hele soaken, saa Z-maalingerne tages ved
  # samme toolhead-temperatur hver gang og deltaet kun er ramme-drift.
  M104 S{hs.probe_temp}
  M190 S{target_bed}                                    # Wait for bed (starter ogsaa bedfan-loopet)

  SET_DISPLAY_TEXT MSG="Hotend: {hs.probe_temp}c"
  TEMPERATURE_WAIT SENSOR=extruder MINIMUM={hs.probe_temp - 2}

  #####################################################################
  #   Heat soak
  #####################################################################
  {% if soak %}
    # Drift-baseret: prober bed-centrum hvert 5. minut og fortsaetter
    # foerst, naar Z-driften og kammertemperaturen er faldet til ro.
    # Loftet paa soak_max cyklusser sikrer, at printet altid kommer
    # i gang - modsat en TEMPERATURE_WAIT uden timeout.
    _HEATSOAK_BEGIN CHAMBER={target_chamber_wait} INTERVAL={params.SOAK_INTERVAL|default(hs.interval)} Z_DRIFT={params.SOAK_DRIFT|default(hs.z_drift)} CHAMBER_DRIFT={params.SOAK_CHAMBER_DRIFT|default(hs.chamber_drift)} MIN_CYCLES={params.SOAK_MIN|default(hs.min_cycles)} STABLE={params.SOAK_STABLE|default(hs.stable_required)}
    {% for i in range(soak_max) %}
      _HEATSOAK_STEP
    {% endfor %}
    _HEATSOAK_FINISH
  {% else %}
    # Fast tidsbaseret soak (SOAK=0)
    {% for m in range(soak_minutes, 0, -1) %}
      SET_DISPLAY_TEXT MSG="Soak: {m} min"
      G4 P60000
    {% endfor %}
  {% endif %}

  #####################################################################
  #   Nivellering og mesh
  #####################################################################
  ##  Uncomment for Trident (Z_TILT_ADJUST)
  SET_DISPLAY_TEXT MSG="Leveling"                       # Display info on display
  Z_TILT_ADJUST                                         # Level the printer via Z_TILT_ADJUST
  G28 Z                                                 # Home Z again after Z_TILT_ADJUST

  ##  Uncomment for bed mesh (2 of 2 for bed mesh)
  SET_DISPLAY_TEXT MSG="Bed mesh"                       # Display info on display
  BED_MESH_CALIBRATE ADAPTIVE=1                         # Start the bed mesh (add ADAPTIVE=1) for adaptive bed mesh

  # Heat up the hotend up to target via data from slicer
  SET_DISPLAY_TEXT MSG="Hotend: {target_extruder}c"     # Display info on display
  G1 X{x_wait} Y{y_wait} Z15 F9000                      # Go to center of the bed
  M107                                                  # Turn off partcooling fan
  M104 S{target_extruder}
  TEMPERATURE_WAIT SENSOR=extruder MINIMUM={target_extruder - 2}

  # MMU: load initial tool now that hotend is at print temp (must happen before prime line)
  {% if mmu_enabled %}
    MMU_START_LOAD_INITIAL_TOOL
  {% endif %}

  # Get ready to print by doing a primeline and updating the LEDs
  SET_DISPLAY_TEXT MSG="Printer goes brr"               # Display info on display
  G0 Z2                                                 # Raise Z to 2
  G91                                                   # Incremental positioning
  SQUIGGLY_PURGE ADAPTIVE_MODE=1 LINE_MARGIN=15         # Purge Line
  G90                                                   # Absolute position
